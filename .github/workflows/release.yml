name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the VSIX to
        required: true
        default: v0.3.0

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # A GitHub Environment with required reviewers configured (Settings ->
    # Environments -> "marketplace-publish") means a compromised PR cannot
    # trigger a real publish without a human approving the run first.
    environment: marketplace-publish
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Package extension
        id: package
        working-directory: packages/vscode-extension
        run: npx @vscode/vsce package --no-dependencies -o extension.vsix

      - name: Publish to VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        working-directory: packages/vscode-extension
        run: npx @vscode/vsce publish --packagePath extension.vsix --pat "$VSCE_PAT" --skip-duplicate

      # Namespace must match package.json "publisher" (bobrowsse-tech), not the display name.
      - name: Create Open VSX namespace
        if: ${{ env.OVSX_PAT != '' }}
        continue-on-error: true
        run: npx ovsx create-namespace bobrowsse-tech --pat "$OVSX_PAT"

      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        continue-on-error: true
        working-directory: packages/vscode-extension
        run: npx ovsx publish extension.vsix --pat "$OVSX_PAT" --skip-duplicate

      - name: Attach .vsix to the GitHub release
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.tag }}
          files: packages/vscode-extension/extension.vsix

      # Trusted publishers on @design-token-extractor/core and
      # @design-token-extractor/cli: GitHub repo bobrowsse-tech/design-token-extractor,
      # workflow release.yml, environment marketplace-publish, allow npm publish.
      # setup-node writes an _authToken line that makes npm skip OIDC — remove it.
      # See https://docs.npmjs.com/trusted-publishers
      - name: Publish npm packages
        run: |
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
          fi
          unset NODE_AUTH_TOKEN
          publish_if_new() {
            local name="$1"
            local dir="$2"
            local version
            version="$(node -p "require('./${dir}/package.json').version")"
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "${name}@${version} is already on npm — skipping."
              return 0
            fi
            npm publish --workspace "$dir" --access public
          }
          publish_if_new "@design-token-extractor/core" packages/core
          publish_if_new "@design-token-extractor/cli" packages/cli
