name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # A GitHub Environment with required reviewers configured (Settings ->
    # Environments -> "marketplace-publish") means a compromised PR cannot
    # trigger a real publish without a human approving the run first.
    environment: marketplace-publish
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Package extension
        id: package
        working-directory: packages/vscode-extension
        run: npx @vscode/vsce package --no-dependencies -o extension.vsix

      - name: Publish to VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        working-directory: packages/vscode-extension
        run: npx @vscode/vsce publish --packagePath extension.vsix --pat "$VSCE_PAT"

      # Namespace must match package.json "publisher" (bobrowsse-tech), not the display name.
      - name: Create Open VSX namespace
        if: ${{ env.OVSX_PAT != '' }}
        continue-on-error: true
        run: npx ovsx create-namespace bobrowsse-tech --pat "$OVSX_PAT"

      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        continue-on-error: true
        working-directory: packages/vscode-extension
        run: npx ovsx publish extension.vsix --pat "$OVSX_PAT"

      - name: Attach .vsix to the GitHub release
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: packages/vscode-extension/extension.vsix
