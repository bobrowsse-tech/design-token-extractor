name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege default; individual jobs don't need write access.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 22 ("Jod") and 24 ("Krypton") are both Active LTS as of this
        # workflow being written — see PUBLISHING-and-SECURITY.md for why
        # only LTS lines are targeted.
        node-version: [22, 24]
    steps:
      # NOTE: pin these to a full commit SHA before using this workflow for
      # real, not just the version tag shown here — tags can be moved by a
      # compromised upstream action, a SHA cannot. See
      # PUBLISHING-and-SECURITY.md, "Pin GitHub Actions to a full commit SHA".
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
